name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build & attach gatekeeper.fap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (release)
        run: ufbt update --channel=release

      - name: Verify the parser and the grading engine
        run: make -C test

      - name: Build Gatekeeper
        run: ufbt

      - name: Attach .fap to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gatekeeper.fap
          fail_on_unmatched_files: true
